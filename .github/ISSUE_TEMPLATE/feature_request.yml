name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        在提建议前，请先看一眼 [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) 里的边界说明：
        这个项目刻意保持「零依赖、零后端、零网络」，云同步、账号体系、前端框架这类方向通常不会被合并。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你设想的做法
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: boundary
    attributes:
      label: 边界确认
      options:
        - label: 该功能不需要联网、不需要账号、不引入 npm 依赖
          required: true
