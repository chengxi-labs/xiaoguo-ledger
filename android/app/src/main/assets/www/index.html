<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3eb" />
    <meta name="description" content="小果管钱——简单好用的本地记账应用" />
    <title>小果管钱</title>
    <link rel="icon" href="./assets/icons/app-icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icons/app-icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <img class="brand-icon" src="./assets/icons/app-icon-192.png" alt="" />
          <div>
            <h1>小果管钱</h1>
            <p id="todayLabel"></p>
          </div>
        </div>
        <button class="data-button" id="exportButton" type="button" aria-label="数据管理">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <ellipse cx="12" cy="5" rx="7" ry="3" />
            <path d="M5 5v6c0 2 3 3 7 3s7-1 7-3V5M5 11v6c0 2 3 3 7 3s7-1 7-3v-6" />
          </svg>
          <span>数据</span>
        </button>
      </header>

      <main>
        <section class="summary-card" aria-labelledby="summaryTitle">
          <div class="month-row">
            <button class="month-button" id="previousMonth" type="button" aria-label="上个月">‹</button>
            <div>
              <p class="eyebrow" id="summaryTitle">当月结余</p>
              <button class="month-label" id="currentMonth" type="button"></button>
            </div>
            <button class="month-button" id="nextMonth" type="button" aria-label="下个月">›</button>
          </div>

          <strong class="balance" id="balance">¥0.00</strong>

          <div class="summary-grid">
            <div>
              <span>当月收入</span>
              <strong id="incomeTotal">¥0.00</strong>
            </div>
            <div>
              <span>当月支出</span>
              <strong id="expenseTotal">¥0.00</strong>
            </div>
          </div>
        </section>

        <section class="search-section" aria-label="查找历史账单">
          <div class="search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8" />
              <path d="m16 16 4.5 4.5" />
            </svg>
            <input
              id="searchInput"
              type="search"
              placeholder="搜索备注、分类、金额或日期"
              autocomplete="off"
            />
            <button id="clearSearch" type="button" aria-label="清除搜索" hidden>×</button>
          </div>
        </section>

        <section class="record-section" aria-labelledby="recordTitle">
          <div class="section-heading">
            <div>
              <p class="section-kicker">账单</p>
              <h2 id="recordTitle">当月记录</h2>
            </div>
            <div class="record-heading-actions">
              <span class="record-count" id="recordCount">0 笔</span>
              <button class="stats-button" id="statsButton" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 19V9m7 10V5m7 14v-7" />
                </svg>
                <span>分类支出</span>
              </button>
            </div>
          </div>
          <div class="record-list" id="recordList"></div>
        </section>
      </main>

      <p class="privacy-note">账目只保存在当前设备，不会上传。</p>
      <button class="add-button" id="addButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>记一笔</span>
      </button>
    </div>

    <div class="sheet-layer" id="sheetLayer" hidden>
      <button class="sheet-backdrop" id="sheetBackdrop" type="button" aria-label="关闭"></button>
      <section class="entry-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-heading">
          <h2 id="sheetTitle">记一笔</h2>
          <button class="close-button" id="closeSheet" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <form id="entryForm" novalidate>
          <div class="type-switch" role="group" aria-label="收支类型">
            <button class="type-option is-active" data-type="expense" type="button">支出</button>
            <button class="type-option" data-type="income" type="button">收入</button>
          </div>

          <label class="amount-field">
            <span>¥</span>
            <input
              id="amountInput"
              name="amount"
              type="number"
              min="0.01"
              step="0.01"
              inputmode="decimal"
              placeholder="0.00"
              autocomplete="off"
              required
            />
          </label>

          <fieldset class="category-fieldset" id="categoryFieldset">
            <legend>选择分类</legend>
            <div class="category-grid" id="categoryGrid"></div>
          </fieldset>

          <div class="form-row">
            <label>
              <span>日期</span>
              <input id="dateInput" name="date" type="date" required />
            </label>
            <label>
              <span>备注</span>
              <input
                id="noteInput"
                name="note"
                type="text"
                maxlength="30"
                placeholder="可选，例如：午饭"
                autocomplete="off"
              />
            </label>
          </div>

          <button class="save-button" type="submit">保存这笔账</button>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="sheet-layer" id="monthPickerLayer" hidden>
      <button class="sheet-backdrop" id="monthPickerBackdrop" type="button" aria-label="关闭"></button>
      <section class="entry-sheet month-picker-sheet" role="dialog" aria-modal="true" aria-labelledby="monthPickerTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-heading">
          <h2 id="monthPickerTitle">选择月份</h2>
          <button class="close-button" id="closeMonthPicker" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div class="month-picker-year">
          <button class="month-button" id="previousPickerYear" type="button" aria-label="上一年">‹</button>
          <strong id="monthPickerYear"></strong>
          <button class="month-button" id="nextPickerYear" type="button" aria-label="下一年">›</button>
        </div>
        <div class="month-grid" id="monthGrid"></div>
        <button class="return-current-button" id="goCurrentMonth" type="button">回到本月</button>
      </section>
    </div>

    <div class="sheet-layer" id="statsLayer" hidden>
      <button class="sheet-backdrop" id="statsBackdrop" type="button" aria-label="关闭"></button>
      <section class="entry-sheet stats-sheet" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-heading">
          <h2 id="statsTitle">分类支出</h2>
          <button class="close-button" id="closeStats" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div class="stats-switch" role="group" aria-label="统计范围">
          <button class="is-active" data-range="month" type="button">月度</button>
          <button data-range="year" type="button">年度</button>
        </div>
        <div class="stats-total">
          <span id="statsPeriod">本月共支出</span>
          <strong id="statsTotal">¥0.00</strong>
        </div>
        <div class="category-stats" id="categoryStats"></div>
      </section>
    </div>

    <div class="sheet-layer" id="exportLayer" hidden>
      <button class="sheet-backdrop" id="exportBackdrop" type="button" aria-label="关闭"></button>
      <section class="entry-sheet export-sheet" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-heading">
          <div>
            <p class="section-kicker">数据</p>
            <h2 id="exportTitle">数据管理</h2>
          </div>
          <button class="close-button" id="closeExport" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <p class="export-copy">可以导入历史记账数据，也可以导出当前全部账目。</p>
        <button class="export-choice" id="importData" type="button">
          <span class="export-choice-icon">导</span>
          <span><strong>导入记账数据</strong><small>合并内置账单，自动跳过重复记录</small></span>
        </button>
        <button class="export-choice" id="exportCsv" type="button">
          <span class="export-choice-icon">表</span>
          <span><strong>导出全部账单</strong><small>CSV 表格，含日期、分类、金额和备注</small></span>
        </button>
        <button class="export-choice" id="exportJson" type="button">
          <span class="export-choice-icon">备</span>
          <span><strong>导出完整备份</strong><small>JSON 文件，保留全部记账数据</small></span>
        </button>
      </section>
    </div>

    <template id="recordTemplate">
      <article class="record-item">
        <div class="record-icon-wrap">
          <img class="record-icon" alt="" />
        </div>
        <div class="record-copy">
          <strong class="record-title"></strong>
          <span class="record-meta"></span>
        </div>
        <strong class="record-amount"></strong>
        <button class="delete-button" type="button" aria-label="删除这笔记录">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 7h14M9 7V4h6v3m2 0-1 13H8L7 7m4 4v5m2-5v5" />
          </svg>
        </button>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
